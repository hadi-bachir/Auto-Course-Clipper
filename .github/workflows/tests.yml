name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest -v

  windows-import-check:
    # the parser is portable, the beeps and keypresses are not - make sure the
    # script still imports and --dry-run still works off Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip pyperclip
      - name: Import check
        run: python -c "import save_clips; print(save_clips.COLUMNS)"
      - name: Dry run
        run: |
          @'
          Some University Malaysia
          Bachelor of Science (Hons) in Business

          Duration: 3 year(s)
          English requirement: IELTS 6.0

          Intake: Jul / Sep

          1st year: RM 34,900
          '@ | Out-File -Encoding utf8 sample.txt
          python save_clips.py --dry-run sample.txt